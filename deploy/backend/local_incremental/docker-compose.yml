services:
  ai-file-navigation:
    build:
      context: ../../..
      dockerfile: deploy/backend/local_incremental/Dockerfile
    image: ai-file-navigation:1.0.0
    container_name: ai-file-navigation
    restart: "no"
    ports:
      - "10001:10001"
    volumes:
      - ../../../server/log:/app/log
      - ../../../server/uploads:/app/uploads

networks:
  default:
    name: vibedeploy-shared
    external: true
